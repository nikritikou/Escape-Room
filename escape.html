```html
<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Escape Room</title>

    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Η εικόνα του κεριού */
        #candle {
            position: relative;
            display: inline-block;
        }

        #candle img {
            display: block;
            max-width: 90vw;
            max-height: 90vh;
        }

        /* ΜΟΝΟ η φλόγα */
        #flame {
            position: absolute;

            /* Ρυθμίζουμε αυτά ανάλογα με τη θέση της φλόγας */
            top: 0;
            left: 50%;

            width: 80px;
            transform: translateX(-50%);

            cursor: pointer;
        }

        /* Όταν πατηθεί η φλόγα */
        #flame.off {
            display: none;
        }
    </style>
</head>

<body>

    <div id="candle">

        <!-- Ολόκληρο το κερί -->
        <img src="images/keri.png" alt="Κερί">

        <!-- ΜΟΝΟ η φλόγα -->
        <img
            id="flame"
            src="images/floga.png"
            alt="Φλόγα"
            onclick="putOutFlame()"
        >

    </div>

    <script>
        function putOutFlame() {
            document.getElementById("flame").classList.add("off");
        }
    </script>

</body>
</html>
```
